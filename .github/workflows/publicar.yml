name: Bot Herbolaria - Publicación

on:
  schedule:
    # 14:00 UTC = 8:00 AM México (CDMX)
    - cron: '0 14 * * *'
    # 21:00 UTC = 3:00 PM México (CDMX)
    - cron: '0 21 * * *'
  workflow_dispatch:  # Para ejecutar manualmente

jobs:
  publicar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalar dependencias
        run: pip install requests
      
      - name: Ejecutar bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPS
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          TELEGRAM_BOT_LINK: ${{ secrets.TELEGRAM_BOT_LINK }}
        run: python bot_herbolaria.py
