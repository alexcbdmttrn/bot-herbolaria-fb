name: Bot Herbolaria - Publicación

on:
  schedule:
    - cron: '0 14 * * *'   # 7 AM CDMX (UTC-6)
    - cron: '0 21 * * *'   # 3 PM CDMX
  workflow_dispatch:

permissions:
  contents: write   # Necesario para que el bot pueda hacer commit

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests

      - name: Ejecutar bot de herbolaria
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python bot_herbolaria.py

      - name: Commit y push del estado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar estado herbolaria [skip ci]"
          file_pattern: estado_herbolaria.json
