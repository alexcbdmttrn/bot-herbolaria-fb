name: Bot Herbolaria - Publicación 2x diario + Respaldo

on:
  schedule:
    - cron: '0 13 * * *'   # 8:00 AM CDMX (Horario Principal Mañana)
    - cron: '0 20 * * *'   # 3:00 PM CDMX (Horario Principal Tarde)
    - cron: '0 23 * * *'   # 6:00 PM CDMX (🛡️ RESPALDO: Si los anteriores fallaron)
  workflow_dispatch:       # Permite ejecución manual (Tu botón de pánico)

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar bot de herbolaria
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python bot_herbolaria.py

      - name: Commit y push del estado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar estado herbolaria [skip ci]"
          file_pattern: estado_herbolaria.json
